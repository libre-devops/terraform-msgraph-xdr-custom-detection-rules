# yaml-language-server: $schema=../../schema/custom-detection.schema.json
#
# Successful sign-ins over the NTLM legacy protocol. Built on IdentityLogonEvents on purpose: that
# table resolves in any Defender XDR tenant's advanced hunting schema, where the Entra specific
# sign-in tables (AadSignInEventsBeta) only resolve when Entra data flows into XDR, which is not
# universal (proven live: a rule on that table fails both remote validation and the rule create in
# tenants without it). Portability is a catalog quality bar.
display_name: Successful sign-in over legacy NTLM authentication
description: >-
  An account signed in successfully using NTLM, a legacy protocol that sidesteps modern
  authentication controls and is a favourite for relay and credential stuffing activity. Tune the
  scope to your estate's expected NTLM baseline before enabling widely.
status: enabled
frequency: PT12H
query: |
  IdentityLogonEvents
  | where ActionType == "LogonSuccess"
  | where Protocol =~ "Ntlm"
  | project Timestamp, ReportId, AccountUpn, AccountSid, AccountDomain, IPAddress, DeviceName,
      Application, Protocol
alert:
  severity: medium
  recommended_actions: >-
    Confirm whether NTLM is expected for this account and source. Where it is not, trace the
    authenticating application, plan the migration to modern authentication, and consider blocking
    legacy protocols for the account.
  mitre:
    - tactic: InitialAccess
      techniques: [T1078]
  custom_details:
    Protocol: Protocol
    Application: Application
  entity_mappings:
    accounts:
      - upn_column: AccountUpn
        sid_column: AccountSid
        nt_domain_column: AccountDomain
    hosts:
      - name_column: DeviceName
    ips:
      - address_column: IPAddress
